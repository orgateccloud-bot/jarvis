[project]
name = "jarvis"
version = "4.0.0"
description = "JARVIS 4.0 — assistente pessoal ativo com Claude, memória local e voz"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "loguru>=0.7.3",
    "psutil>=6.0",
    "send2trash>=1.8",
    "pypdf>=5",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "bandit>=1.7"]
# Etapa 2, escuta por voz local (JARVIS_VOZ_LOCAL=1): pip install -e .[voz] e depois python -m jarvis.voz.baixar
voz = ["numpy>=1.26", "onnxruntime>=1.18", "sounddevice>=0.5", "faster-whisper>=1.2",
       "winrt-runtime>=3; sys_platform == 'win32'",
       "winrt-Windows.Media.SpeechSynthesis; sys_platform == 'win32'",
       "winrt-Windows.Storage.Streams; sys_platform == 'win32'"]
# Whisper na GPU NVIDIA (CUDA 12): cuBLAS e cuDNN dos wheels oficiais, carregados por jarvis/voz/cuda.py
voz-gpu = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# o teste de fumaça real (Menu Iniciar, registro e janelas desta máquina) só roda com: pytest -m windows_real
addopts = "-m 'not windows_real'"
markers = [
    "windows_real: lê o Windows de verdade; fora da execução padrão",
    "voz_modelos: usa os modelos de voz baixados; pulado se faltarem (ex.: no CI)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["_legado", "venv", "jarvis-hud"]

[tool.bandit]
exclude_dirs = ["_legado", "venv", "tests", "jarvis-hud"]
