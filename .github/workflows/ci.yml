name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo Python (testes, ruff, bandit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check jarvis tests
      - run: bandit -q -r jarvis -ll
      - run: python -m pytest -q
        env:
          JARVIS_PROATIVO: "0"

  hud:
    name: HUD (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-hud/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
